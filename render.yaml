# Render blueprint: one service for everything. FastAPI serves the API (/api/..., /docs) and the website,
# which is the static export committed in web/out (rebuild it with `npm run build` in web/ after changing the site).
services:
  - type: web
    name: mizan-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
