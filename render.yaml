# Render blueprint for the scoring API (FastAPI + the trained models in models/final).
# The website (web/) deploys separately on Vercel and calls this service through MIZAN_API_URL.
services:
  - type: web
    name: mizan-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
